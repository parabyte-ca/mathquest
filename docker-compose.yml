services:
  mathquest:
    image: ghcr.io/parabyte-ca/mathquest:${MATHQUEST_VERSION:?set MATHQUEST_VERSION in .env}
    container_name: mathquest
    restart: unless-stopped
    user: "${MATHQUEST_UID:-568}:${MATHQUEST_GID:-568}"
    ports:
      - "${MATHQUEST_PORT:-8086}:8086"
    env_file: .env
    environment:
      PORT: "8086"
      DATA_DIR: /data
      UPGRADE_DIR: /upgrade
      UPGRADE_STATUS_DIR: /upgrade-status
    volumes:
      - ./data:/data
      - ./upgrade:/upgrade # request inbox: the only thing the app can hand to the host
      - ./upgrade-status:/upgrade-status:ro # written by the root upgrade agent
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8086/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
