name: Release
# Merging a PR that changes VERSION is the release: build, push, sign, tag and publish.
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
  packages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin
        with:
          fetch-depth: 0
      - name: Read and validate VERSION
        id: v
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must be X.Y.Z"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "tag v$v already exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4 # pin
      - uses: docker/login-action@v3 # pin
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6 # pin
        id: build
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/parabyte-ca/mathquest:${{ steps.v.outputs.version }}
            ghcr.io/parabyte-ca/mathquest:latest
      - uses: sigstore/cosign-installer@v3 # pin
      - name: Sign the image (keyless, GitHub OIDC)
        run: cosign sign --yes "ghcr.io/parabyte-ca/mathquest@${{ steps.build.outputs.digest }}"
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "MathQuest $VERSION" --notes-file notes.md
